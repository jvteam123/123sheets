<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team123 - Project Tracker V3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ... (existing styles remain unchanged) ... */
    </style>
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body class="login-view-active">

    <div id="auth-wrapper">
        <h2>Project Tracker V3</h2>
        <p>Please sign in to continue.</p>
        <button id="signInBtn" class="btn btn-primary">Sign in with Google</button>
    </div>

    <div class="dashboard-wrapper" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Team123</h2>
                <div id="loggedInUser"></div>
                 <div id="notificationBell">
                    <i class="fas fa-bell"></i>
                    <span id="notificationBadge"></span>
                </div>
                <div id="notificationList"></div>
            </div>
            <div class="sidebar-nav">
                <div> 
                    <button id="openDashboardBtn" class="active"><i class="fas fa-chart-bar icon"></i> Dashboard Feed</button>
                    <button id="openProjectListBtn"><i class="fas fa-tasks icon"></i> Projects</button>
                    
                    <button id="openNewProjectModalBtn"><i class="fas fa-plus icon"></i> Add Project</button>
                    <button id="openTlSummaryBtn"><i class="fas fa-chart-line icon"></i> TL Summary</button>
                    <button id="openProjectSettingsBtn"><i class="fas fa-cogs icon"></i> Project Settings</button>
                    <button id="openUserManagementBtn"><i class="fas fa-users icon"></i> User Management</button>
                    <button id="openDisputeBtn"><i class="fas fa-exclamation-triangle icon"></i> Dispute</button>
                    <button id="openDowntimePageBtn"><i class="fas fa-pause-circle icon"></i> Downtime</button>
                    <button id="openAdminSettingsBtn"><i class="fas fa-user-shield icon"></i> Admin Settings</button>
                    <hr>
                    <div id="extrasMenu"></div>
                    <hr>
                </div>
            </div>
            <button id="signOutBtn" class="btn btn-danger">Sign Out</button>
        </aside>

        <main class="main-content">
            <div id="feedDashboardContainer" style="display: flex; flex-direction: column; flex-grow: 1; overflow: hidden;">
                <div class="view-header">
                    <h2>Dashboard Feed</h2>
                    <button id="refreshFeedBtn" class="btn btn-secondary" title="Refresh Feed"><i class="fas fa-sync-alt"></i></button>
                </div>
                <div id="feedContent" class="table-container" style="padding: 20px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px;">
                    <i class="fas fa-fire" style="font-size: 3em; color: #e74c3c; margin-bottom: 15px;"></i>
                    <h1 style="margin: 0;">Project Status Feed (Firebase)</h1>
                    <p style="margin-top: 10px;">This new feed will dynamically show project status updates, comments, and graphs, powered by a Firebase backend for real-time data.</p>
                </div>
            </div>
            
            <div id="projectListView" style="display: none;">
                <div class="filter-section">
                    <div class="filter-group">
                        <label for="projectFilter">Project:</label>
                        <select id="projectFilter">
                            <option value="All">All Projects</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="fixCategoryFilter">Fix Category:</label>
                        <select id="fixCategoryFilter">
                            <option value="All">All</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <input type="checkbox" id="showDay2"><label for="showDay2">Show Day 2</label>
                        <input type="checkbox" id="showDay3"><label for="showDay3">Show Day 3</label>
                        <input type="checkbox" id="showDay4"><label for="showDay4">Show Day 4</label>
                        <input type="checkbox" id="showDay5"><label for="showDay5">Show Day 5</label>
                    </div>
                    <div class="filter-group" style="margin-left: auto;">
                        <button id="refreshDataBtn" class="btn btn-secondary" title="Refresh Data"><i class="fas fa-sync-alt"></i></button>
                    </div>
                </div>
                 <div id="techDashboard" class="table-container">
                    <div class="table-scroll-wrapper">
                        <table id="projectTable" class="project-table">
                            <thead>
                                <tr></tr>
                            </thead>
                            <tbody id="projectTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="tlSummaryView" class="table-container" style="display: none;">
                </div>

            <div id="userManagementView" class="table-container">
                </div>
            
            <div id="disputeView" class="table-container">
                </div>

            <div id="projectSettingsView" style="display: none;"></div>
            <div id="adminSettingsView" style="display: none;"></div>

        </main>
    </div>
    
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="script.js"></script>
</body>
</html>
