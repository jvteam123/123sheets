<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team123 - Project Tracker V3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #6c757d;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
            --info-color: #8e44ad; /* Purple for Started Available */
            --bg-color: #f0f2f5;
            --card-bg-color: #ffffff;
            --text-color: #2c3e50;
            --border-color: #e0e0e0;
            --shadow-light: 0 2px 5px rgba(0,0,0,0.05);
            --border-radius-md: 8px;
            --border-radius-lg: 12px;
            /* Fix Stage Colors */
            --fix-color-1: #eaf6ff;
            --fix-color-2: #eafaf1;
            --fix-color-3: #fff8e1;
            --fix-color-4: #fbe9e7;
            --fix-color-5: #f3e5f5;
        }
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        body {
            font-family: 'Inter', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        body.login-view-active {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .dashboard-wrapper { display: flex; height: 100vh; width: 100%; }
        .sidebar { width: 250px; background-color: var(--text-color); color: #ecf0f1; padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #475569; flex-shrink: 0; }
        .sidebar-header { text-align: center; margin-bottom: 20px; position: relative; }
        .sidebar-header h2 { color: #fff; margin-top: 0; margin-bottom: 5px; font-size: 1.5em; }
        .sidebar-header #loggedInUser { color: #bdc3c7; font-size: 0.9em; }
        
        .sidebar-nav {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        #signOutBtn {
            margin-top: auto;
        }
        
        .sidebar-nav::-webkit-scrollbar { width: 8px; }
        .sidebar-nav::-webkit-scrollbar-track { background: var(--text-color); }
        .sidebar-nav::-webkit-scrollbar-thumb { background-color: #475569; border-radius: 10px; border: 2px solid var(--text-color); }
        .sidebar-nav::-webkit-scrollbar-thumb:hover { background-color: #6c757d; }
        .sidebar-nav::-webkit-scrollbar-corner { background: var(--text-color); }
        
        .sidebar-nav button, .sidebar-nav a.btn-extra { display: flex; align-items: center; width: 100%; padding: 12px 15px; margin-bottom: 10px; background-color: transparent; border: none; color: #ecf0f1; font-size: 1.1em; cursor: pointer; border-radius: var(--border-radius-md); transition: background-color 0.3s ease; text-align: left; gap: 12px; text-decoration: none; }
        .sidebar-nav button:hover, .sidebar-nav button.active, .sidebar-nav a.btn-extra:hover { background-color: #475569; }
        .sidebar-nav button .icon, .sidebar-nav a.btn-extra .icon { font-size: 1.2em; }
        .main-content { flex-grow: 1; padding: 25px; display: flex; flex-direction: column; overflow: auto; }
        .btn { padding: 8px 16px; border: none; border-radius: var(--border-radius-md); cursor: pointer; font-size: 1em; font-weight: 500; }
        .btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-success { background-color: var(--success-color); color: white; }
        .btn-warning { background-color: var(--warning-color); color: white; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-secondary { background-color: var(--secondary-color); color: white; }

        .filter-section {
            background-color: var(--card-bg-color);
            border-radius: var(--border-radius-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-light);
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            position: relative;
        }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-weight: 500; color: var(--text-color); font-size: 0.95em; }
        .filter-group select, .filter-group input[type="text"] {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            font-size: 0.9em;
        }
        .filter-group input[type="checkbox"] + label {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            font-size: 0.9em;
            cursor: pointer;
            min-width: 120px;
        }
        .filter-group input[type="checkbox"] { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .filter-group input[type="checkbox"] + label { display: inline-flex; align-items: center; justify-content: center; background-color: #f0f0f0; color: #333; border: 1px solid #ddd; padding: 8px 12px; border-radius: 5px; cursor: pointer; transition: background-color 0.2s, border-color 0.2s; min-width: unset; }
        .filter-group input[type="checkbox"] + label:hover { background-color: #e0e0e0; }
        .filter-group input[type="checkbox"]:checked + label { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        #techDashboardContainer { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
        .table-container { background-color: var(--card-bg-color); border-radius: var(--border-radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-light); padding: 20px; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .table-scroll-wrapper { width: 100%; flex-grow: 1; overflow: auto; }
        #tlSummaryView .table-scroll-wrapper { max-height: calc(100vh - 200px); }
        .project-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.9em; }
        .project-table th, .project-table td { padding: 12px 10px; white-space: nowrap; border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
        .project-table th { background-color: #f8f9fa; font-weight: 600; text-align: left; position: sticky; top: 0; z-index: 10; }
        .project-table td:first-child, .project-table th:first-child { border-left: 1px solid var(--border-color); }
        .summary-project-header td { background-color: #e9ecef; font-weight: 600; }
        .summary-stage-row td:first-child { padding-left: 30px; }
        .view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .view-header h2 { margin: 0; }

        /* Status Colors */
        .status { padding: 4px 8px; border-radius: 4px; font-weight: 500; color: #fff; text-transform: capitalize; }
        .status-available { background-color: var(--secondary-color); }
        .status-inprogress, .status-inprogressday1, .status-inprogressday2, .status-inprogressday3, .status-inprogressday4, .status-inprogressday5 { background-color: var(--warning-color); }
        .status-completed { background-color: var(--success-color); }
        .status-startedavailable { background-color: var(--info-color); }
        .status-open { background-color: var(--warning-color); }
        .status-done { background-color: var(--success-color); }
        .status-norefix { background-color: #7f8c8d; }

        .total-minutes-cell { background-color: #ffedd5; font-weight: 600; }
        .time-cell .edit-icon { margin-left: 8px; cursor: pointer; color: var(--secondary-color); }
        .time-cell .edit-icon:hover { color: var(--primary-color); }
        .actions-btn-group { display: flex; gap: 5px; }

        /* Highlighting Styles */
        tr.fix-stage-1, .summary-stage-row.fix-stage-1 { background-color: var(--fix-color-1); }
        tr.fix-stage-2, .summary-stage-row.fix-stage-2 { background-color: var(--fix-color-2); }
        tr.fix-stage-3, .summary-stage-row.fix-stage-3 { background-color: var(--fix-color-3); }
        tr.fix-stage-4, .summary-stage-row.fix-stage-4 { background-color: var(--fix-color-4); }
        tr.fix-stage-5, .summary-stage-row.fix-stage-5 { background-color: var(--fix-color-5); }
        tr.fix-stage-1:hover, tr.fix-stage-2:hover, tr.fix-stage-3:hover, tr.fix-stage-4:hover, tr.fix-stage-5:hover,
        .summary-stage-row:hover { background-color: #d1eaff; }
        .project-separator-row td { border-bottom: 2px solid #333; padding: 5px 0 !important; background-color: #f0f2f5; }
        .fix-separator-row td { border-bottom: 1px dashed #ccc; padding: 3px 0 !important; background-color: #f0f2f5; }

        #auth-wrapper { max-width: 420px; width: 100%; text-align: center; background-color: white; padding: 40px 50px; border-radius: var(--border-radius-lg); box-shadow: var(--shadow-light); }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.6); }
        .modal.is-open { display: flex; justify-content: center; align-items: center; }
        .modal-content { background-color: var(--card-bg-color); margin: auto; padding: 25px; border-radius: var(--border-radius-lg); width: 90%; max-width: 600px; position: relative; }
        .modal-content.modal-lg { max-width: 95%; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h2 { margin: 0; }
        .modal-actions { display: flex; align-items: center; gap: 20px; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .time-edit-group { display: flex; gap: 10px; align-items: center; }
        .time-edit-group input { flex-grow: 1; }
        .time-edit-group select { width: 80px; }
        .close-btn { color: #aaa; font-size: 28px; font-weight: bold; cursor: pointer; }

        /* Custom Modal (Alert/Confirm) */
        #customModal .modal-content { max-width: 450px; text-align: center; }
        #customModalBody { margin: 20px 0; font-size: 1.1em; }
        #customModalFooter { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        #customModalPromptInput { margin-top: 15px; }

        /* Loading Spinner */
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); color: white; z-index: 1001; display: none; justify-content: center; align-items: center; flex-direction: column; font-size: 1.2em; }
        #loadingOverlay.is-open { display: flex; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255, 255, 255, 0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .progress-bar { width: 100%; background-color: #e0e0e0; border-radius: 5px; overflow: hidden; height: 20px; }
        .progress-bar-fill { height: 100%; background-color: var(--success-color); text-align: center; line-height: 20px; color: white; transition: width 0.3s ease; }
    </style>
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body class="login-view-active">

    <div id="auth-wrapper">
        <h2>Project Tracker V3</h2>
        <p>Please sign in to continue.</p>
        <button id="signInBtn" class="btn btn-primary" disabled>Loading...</button>
    </div>

    <div class="dashboard-wrapper" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Team123</h2>
                <div id="loggedInUser"></div>
            </div>
            <div class="sidebar-nav">
                <div> 
                    <button id="openDashboardBtn" class="active"><i class="fas fa-tasks icon"></i> Dashboard</button>
                    <button id="openNewProjectModalBtn"><i class="fas fa-plus icon"></i> Add Project</button>
                    <button id="openTlSummaryBtn"><i class="fas fa-chart-line icon"></i> TL Summary</button>
                </div>
            </div>
            <button id="signOutBtn" class="btn btn-danger">Sign Out</button>
        </aside>

        <main class="main-content">
            <div id="techDashboardContainer">
                <div class="filter-section">
                    <div class="filter-group">
                        <label for="searchBar"><i class="fas fa-search"></i></label>
                        <input type="text" id="searchBar" placeholder="Search tasks..." style="width: 200px;">
                    </div>
                    <div class="filter-group">
                        <label for="projectFilter">Project:</label>
                        <select id="projectFilter">
                            <option value="All">All Projects</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="fixCategoryFilter">Fix Category:</label>
                        <select id="fixCategoryFilter">
                            <option value="All">All</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <input type="checkbox" id="showDay2"><label for="showDay2">Show Day 2</label>
                        <input type="checkbox" id="showDay3"><label for="showDay3">Show Day 3</label>
                    </div>
                    <div class="filter-group" style="margin-left: auto;">
                        <button id="refreshDataBtn" class="btn btn-secondary" title="Refresh Data"><i class="fas fa-sync-alt"></i></button>
                    </div>
                </div>
                 <div id="techDashboard" class="table-container">
                    <div class="table-scroll-wrapper">
                        <table id="projectTable" class="project-table">
                            <thead>
                                <tr></tr>
                            </thead>
                            <tbody id="projectTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="tlSummaryView" class="table-container" style="display: none;">
                <div class="view-header">
                    <h2>Project Summary</h2>
                </div>
                <div class="table-scroll-wrapper">
                    <table id="summaryTable" class="project-table">
                        <thead>
                            <tr>
                                <th>Project / Stage</th>
                                <th>Total Areas</th>
                                <th>Completed</th>
                                <th>Progress</th>
                                <th>Total Minutes</th>
                                <th>Total Hours (Decimal)</th>
                            </tr>
                        </thead>
                        <tbody id="summaryTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <div id="projectFormModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" data-modal-id="projectFormModal">&times;</span>
            <h2>Add New Project</h2>
            <form id="newProjectForm">
                <label for="numRows">Number of Areas:</label>
                <input type="number" id="numRows" name="numRows" value="1" min="1" required>
                <label for="baseProjectName">Project Name:</label>
                <input type="text" id="baseProjectName" name="baseProjectName" placeholder="e.g., PROJ_ID_XYZ" required>
                <label for="fixCategory">Fix Stage:</label>
                <select id="fixCategory" name="fixCategory" required>
                    <option value="Fix1">Fix1</option>
                    <option value="Fix2">Fix2</option>
                    <option value="Fix3">Fix3</option>
                </select>
                <label for="gsd">GSD:</label>
                <select id="gsd" name="gsd" required>
                    <option value="3in">3in</option>
                    <option value="6in">6in</option>
                </select>
                <button type="submit" class="btn btn-success">Add Project(s)</button>
            </form>
        </div>
    </div>

    <div id="timeEditModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" data-modal-id="timeEditModal">&times;</span>
            <h2 id="timeEditTitle">Edit Time</h2>
            <form id="timeEditForm">
                <input type="hidden" id="timeEditProjectId">
                <input type="hidden" id="timeEditDay">
                <label for="editStartTime">Start Time (HH:MM):</label>
                <div class="time-edit-group">
                    <input type="text" id="editStartTime" pattern="(1[0-2]|0?[1-9]):[0-5][0-9]" placeholder="e.g., 09:30">
                    <select id="editStartTimeAmPm">
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </select>
                </div>
                <label for="editFinishTime">Finish Time (HH:MM):</label>
                <div class="time-edit-group">
                    <input type="text" id="editFinishTime" pattern="(1[0-2]|0?[1-9]):[0-5][0-9]" placeholder="e.g., 05:30">
                    <select id="editFinishTimeAmPm">
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Save Time</button>
            </form>
        </div>
    </div>
    
    <div id="customModal" class="modal">
        <div class="modal-content">
            <h2 id="customModalTitle"></h2>
            <p id="customModalBody"></p>
            <div id="customModalPromptContainer"></div>
            <div id="customModalFooter">
                <button id="customModalConfirm" class="btn btn-primary">OK</button>
                <button id="customModalCancel" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
